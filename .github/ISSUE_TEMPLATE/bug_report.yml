name: Bug report
description: Something isn't working as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the exact error message or tool result.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Start the server with ...\n2. Call search_papers with ...\n3. See error"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0 or a commit SHA
  - type: dropdown
    id: mode
    attributes:
      label: How are you running it?
      options: [stdio (Claude Desktop / Inspector), Streamable HTTP, Docker, Web app]
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Server logs (stderr). Remove any secrets first.
      render: text
